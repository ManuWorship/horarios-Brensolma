<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horarios Brensolma</title>
<meta name="theme-color" content="#ffffff">
<script src="tema.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Horarios BSM">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header>
  <div class="marca"><img src="casa.png" alt=""><div><strong>Horarios Brensolma</strong><span id="hola"></span></div></div>
  <nav>
    <button id="btn-perfil" class="chico" type="button">Mi perfil</button>
    <button id="btn-salir" class="chico" type="button" hidden>Salir</button>
  </nav>
</header>

<div id="aviso" class="aviso" hidden></div>

<main>
  <section id="pantalla-cargando" class="cargando">
    <img class="logo-grande solo-claro" src="logo-claro.png" alt="Brensolma">
    <img class="logo-grande solo-oscuro" src="logo-oscuro.png" alt="Brensolma">
    <p class="nota">Cargando…</p>
  </section>

  <section id="pantalla-login" hidden>
    <img class="logo-grande solo-claro" src="logo-claro.png" alt="Brensolma">
    <img class="logo-grande solo-oscuro" src="logo-oscuro.png" alt="Brensolma">
    <h1>Ingresar</h1>
    <form id="form-login">
      <label id="campo-nombre" hidden>Nombre y apellido<input id="nombre" autocomplete="name"></label>
      <label>Mail<input id="email" type="email" autocomplete="email" required></label>
      <label>Contraseña<input id="pass" type="password" autocomplete="current-password" minlength="6" required></label>
      <button type="submit" value="login" class="marcar principal">Entrar</button>
      <button type="submit" value="registro" class="marcar secundario">Crear cuenta</button>
    </form>
    <p class="chico"><button id="btn-mostrar-registro" type="button" class="link">Es mi primera vez</button> ·
      <button id="btn-olvide" type="button" class="link">Me olvidé la contraseña</button></p>
  </section>

  <section id="pantalla-pendiente" hidden>
    <h1>Cuenta pendiente</h1>
    <p>Tu cuenta está creada. Falta que administración la active.</p>
    <p class="nota" id="estado-casa-2"></p>
  </section>

  <section id="pantalla-marcar" hidden>
    <p id="fecha-hoy" class="fecha"></p>
    <p id="estado" class="estado"></p>
    <div id="botones"></div>
    <h2>Hoy</h2>
    <p id="sin-marcas" class="nota">Sin marcas todavía.</p>
    <ol id="lista-hoy" class="lista"></ol>
  </section>

  <section id="pantalla-perfil" hidden>
    <h1>Mi perfil</h1>
    <p id="estado-casa" class="nota"></p>
    <h2>Apariencia</h2>
    <div class="selector-tema" role="group" aria-label="Tema">
      <button type="button" data-tema="auto">Automático</button>
      <button type="button" data-tema="claro">☀️ Claro</button>
      <button type="button" data-tema="oscuro">🌙 Oscuro</button>
    </div>
    <p class="nota">La ubicación solo se toma en el momento de cada marca. La app no te sigue durante el día.</p>
    <button id="btn-volver" class="marcar secundario" type="button">Volver</button>
  </section>
</main>

<dialog id="dialogo">
  <form method="dialog">
    <h2 id="dialogo-titulo"></h2>
    <input id="dialogo-buscar" type="search" placeholder="🔎 Buscar por nombre o número…" autocomplete="off" hidden>
    <div id="dialogo-opciones" class="opciones"></div>
    <p id="dialogo-vacio" class="nota" hidden>No hay coincidencias.</p>
    <div id="dialogo-libre" hidden>
      <input id="dialogo-input">
      <button id="dialogo-ok" type="button" class="marcar principal">Listo</button>
    </div>
    <button id="dialogo-cancelar" type="button" class="link">Cancelar</button>
  </form>
</dialog>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
